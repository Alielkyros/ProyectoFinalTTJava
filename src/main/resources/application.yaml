spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:ecommerce;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true # Tu línea de JPA
  sql:
    init:
      mode: always
      data-locations: classpath:products.sql  # <--- Esta es la configuración correcta
  h2:
    console:
      enabled: true
      path: /h2-console